name: OrangeFox_k50U - 构建

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox 版本'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
      DEVICE_TREE:
        description: 'OrangeFox设备树'
        required: true
        default: 'https://github.com/xyyyico/android_device_xiaomi_diting.git'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox设备树分支'
        required: true
        default: 'main'  # 这里已修复！
      DEVICE_PATH:
        description: '指定设备路径'
        required: true
        default: 'device/xiaomi/diting'
      DEVICE_NAME:
        description: '指定设备代号'
        required: true
        default: 'diting'
      BUILD_TARGET:
        description: '构建目标'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
      DN:
        description: '设备名称'
        required: true
        default: 'Redmi K50 至尊版'

jobs:
  build:
    name: 🏠 由 ${{ github.actor }} 构建REC
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: 🧱 构建配置
      run: |
        echo "构建配置"
        echo "设备代号: ${{ inputs.DEVICE_NAME }}"
        echo "设备名称: ${{ inputs.DN }}"
        echo "OrangeFox版本: ${{ inputs.MANIFEST_BRANCH }}"
        echo "指定设备路径: ${{ inputs.DEVICE_PATH }}"
        echo "构建: ${{ inputs.BUILD_TARGET }}"
    - name: ✅ 检查
      uses: actions/checkout@v4
              
    - name: 🧹 清理
      uses: rokibhasansagar/slimhub_actions@main

    - name: 🚢 Swap空间
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: 🤖 构建环境
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: 🏙️ 初始化清单
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: 🌳 克隆设备树
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: 🦊 构建OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Official
        set -e
        lunch omni_${{ inputs.DEVICE_NAME }}-eng
        mka ${{ inputs.BUILD_TARGET }}image

    - name: 💿 整理镜像
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/upload_artifacts
        FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        OUT_DIR="${FOX_DIR}/out/target/product/${{ inputs.DEVICE_NAME }}"
        find "$OUT_DIR" -maxdepth 1 -name "*.img" -o -name "*.zip" | xargs -I {} cp {} ${GITHUB_WORKSPACE}/upload_artifacts/

    - name: 🎥 上传至发行版
      uses: softprops/action-gh-release@v2
      with:
        files: upload_artifacts/*
        name: diting-OrangeFox-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
